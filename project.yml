name: Tatami
options:
  bundleIdPrefix: com.kaiizen
  deploymentTarget:
    macOS: "15.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
targets:
  Tatami:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaiizen.Tatami
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # Real signing identity (not ad-hoc): keeps the code signature stable
        # across rebuilds so the Accessibility grant in TCC keeps matching.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 93H68BT82H
        ENABLE_HARDENED_RUNTIME: false
